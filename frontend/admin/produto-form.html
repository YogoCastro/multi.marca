<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Novo Produto | Painel Administrativo</title>

    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/admin.css" />
  </head>

  <body class="admin-page">
    <div class="admin-layout">
      <aside class="admin-sidebar">
        <div class="admin-brand">
          <a href="../index.html" class="admin-logo"> MULTICHEIROS </a>

          <span class="admin-label"> ADMIN </span>
        </div>

        <nav class="admin-navigation">
          <span class="admin-nav-title"> PAINEL </span>

          <a href="index.html" class="admin-nav-link">
            <span class="admin-nav-icon">▦</span>
            <span>Dashboard</span>
          </a>

          <a href="produtos.html" class="admin-nav-link active">
            <span class="admin-nav-icon">◫</span>
            <span>Produtos</span>
          </a>

          <a href="usuarios.html" class="admin-nav-link">
            <span class="admin-nav-icon">◉</span>
            <span>Usuários</span>
          </a>

          <a href="#" class="admin-nav-link">
            <span class="admin-nav-icon">≡</span>
            <span>Pedidos</span>
          </a>

          <span class="admin-nav-title"> GERENCIAMENTO </span>

          <a href="produto-form.html" class="admin-nav-link">
            <span class="admin-nav-icon">+</span>
            <span>Novo produto</span>
          </a>
        </nav>

        <div class="admin-sidebar-footer">
          <a href="../index.html" class="admin-sidebar-action">
            <span>←</span>
            <span>Voltar para loja</span>
          </a>

          <button
            type="button"
            class="admin-sidebar-action admin-logout"
            id="admin-logout"
          >
            <span>↪</span>
            <span>Sair</span>
          </button>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-header">
          <div class="admin-header-content">
            <div>
              <span class="admin-page-label"> GERENCIAMENTO </span>

              <h1>Novo produto</h1>

              <p>Cadastre um novo produto na loja Multicheiros.</p>
            </div>
          </div>
        </header>

        <div class="admin-content">
          <section class="admin-panel">
            <div class="admin-panel-header">
              <div>
                <h2>Informações do produto</h2>

                <p>Preencha os dados do produto abaixo.</p>
              </div>
            </div>

            <form id="product-form">
              <div class="admin-form-grid">
                <div class="admin-form-group">
                  <label for="product-name"> Nome do produto </label>

                  <input
                    type="text"
                    id="product-name"
                    name="name"
                    placeholder="Ex: Camisa Multicheiros"
                    required
                  />
                </div>

                <div class="admin-form-group">
                  <label for="product-price"> Preço </label>

                  <input
                    type="number"
                    id="product-price"
                    name="price"
                    placeholder="89.90"
                    step="0.01"
                    min="0"
                    required
                  />
                </div>

                <div class="admin-form-group">
                  <label for="product-stock"> Estoque </label>

                  <input
                    type="number"
                    id="product-stock"
                    name="stock"
                    placeholder="10"
                    min="0"
                    required
                  />
                </div>

                <div class="admin-form-group">
                  <label for="product-image"> Imagem </label>
                  <input
                    type="file"
                    id="product-image"
                    name="image"
                    accept="image/*"
                    multiple
                  />
                </div>

                <div class="admin-form-group admin-form-full">
                  <label for="product-description"> Descrição </label>

                  <textarea
                    id="product-description"
                    name="description"
                    rows="5"
                    placeholder="Descrição do produto..."
                  ></textarea>
                </div>
              </div>

              <div class="admin-form-actions">
                <a href="produtos.html" class="admin-store-button">
                  Cancelar
                </a>

                <button type="submit" class="admin-primary-button">
                  Salvar produto
                </button>
              </div>
            </form>
          </section>
        </div>
      </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
  </body>
</html>
