<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Criar conta | Multicheiros</title>

    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/auth.css" />
  </head>

  <body class="auth-page">
    <main class="auth-main">
      <section class="auth-container">
        <a href="index.html" class="auth-logo"> MULTICHEIROS </a>

        <div class="auth-card">
          <div class="auth-header">
            <h1>Criar sua conta</h1>

            <p>Cadastre-se para começar a comprar.</p>
          </div>

          <form class="auth-form" id="register-form" novalidate>
            <div class="form-group">
              <label for="name"> Nome </label>

              <input
                type="text"
                id="name"
                name="name"
                placeholder="Digite seu nome"
                autocomplete="name"
                required
              />

              <small class="field-error" id="name-error"></small>
            </div>

            <div class="form-group">
              <label for="email"> E-mail </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu e-mail"
                autocomplete="email"
                required
              />

              <small class="field-error" id="email-error"></small>
            </div>

            <div class="form-group">
              <label for="password"> Senha </label>

              <div class="password-wrapper">
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Digite sua senha"
                  autocomplete="new-password"
                  required
                />

                <button
                  type="button"
                  class="password-toggle"
                  id="password-toggle"
                >
                  Mostrar
                </button>
              </div>

              <small class="field-error" id="password-error"></small>
            </div>

            <div class="form-group">
              <label for="password-confirm"> Confirmar senha </label>

              <div class="password-wrapper">
                <input
                  type="password"
                  id="password-confirm"
                  name="password-confirm"
                  placeholder="Digite a senha novamente"
                  autocomplete="new-password"
                  required
                />

                <button
                  type="button"
                  class="password-toggle"
                  id="password-confirm-toggle"
                >
                  Mostrar
                </button>
              </div>

              <small class="field-error" id="password-confirm-error"></small>
            </div>

            <div class="form-message" id="form-message" role="alert"></div>

            <button type="submit" class="auth-button">Criar conta</button>
          </form>

          <div class="auth-switch">
            <span> Já possui uma conta? </span>

            <a href="login.html"> Entrar </a>
          </div>
        </div>
      </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
